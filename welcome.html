<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Northern Sales</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #0a0a0a; color: #fff;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.container { text-align: center; padding: 40px 20px; position: relative; z-index: 2; }
.logo { width: 64px; height: 64px; margin: 0 auto 32px; opacity: 0; animation: up 0.8s ease forwards 0.2s; }
.logo svg { width: 100%; height: 100%; }
h1 { font-size: clamp(36px, 8vw, 72px); font-weight: 600; letter-spacing: -2px; line-height: 1.1; margin-bottom: 16px; }
h1 span { display: inline-block; opacity: 0; animation: up 0.6s ease forwards; }
h1 span:nth-child(1) { animation-delay: 0.6s; }
h1 span:nth-child(2) { animation-delay: 0.75s; }
h1 span:nth-child(3) { animation-delay: 0.9s; }
p { font-size: clamp(16px, 3vw, 22px); color: #888; font-weight: 400; letter-spacing: 0.5px; margin-bottom: 48px; opacity: 0; animation: up 0.8s ease forwards 1.2s; }
a.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 40px; background: #fff; color: #0a0a0a;
  border-radius: 100px; font-size: 16px; font-weight: 500;
  text-decoration: none; opacity: 0;
  animation: up 0.8s ease forwards 1.6s;
  transition: transform 0.2s, box-shadow 0.2s;
}
a.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(255,255,255,0.15); }
a.btn svg { width: 18px; height: 18px; }
.shapes { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.shape { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%); animation: float 20s infinite ease-in-out; }
.shape:nth-child(1) { width: 600px; height: 600px; top: -200px; left: -200px; }
.shape:nth-child(2) { width: 400px; height: 400px; bottom: -100px; right: -100px; animation-delay: -5s; }
.shape:nth-child(3) { width: 300px; height: 300px; top: 40%; left: 60%; animation-delay: -10s; }
@keyframes up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes float { 0%,100%{transform:translate(0,0)scale(1)} 33%{transform:translate(30px,-30px)scale(1.05)} 66%{transform:translate(-20px,20px)scale(0.95)} }
.footer { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #555; opacity: 0; animation: up 0.8s ease forwards 2s; }
</style>
</head>
<body>
<div class="shapes"><div class="shape"></div><div class="shape"></div><div class="shape"></div></div>
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </div>
  <h1><span>Welcome to</span><br><span>Northern</span> <span>Sales</span></h1>
  <p>Your local marketplace. Quality products, trusted sellers.</p>
  <a href="index.html" class="btn">
    Browse products
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </a>
</div>
<div class="footer">Northern Sales &copy; 2026</div>
</body>
</html>
